name: Publish verified Windows package

on:
  push:
    branches: [codex/publish-verified-1.21.19]
    paths:
      - .github/workflows/publish-verified-windows.yml
      - .github/release-receipts/1.21.19.json
      - .github/release-receipts/1.21.19.package-manifest.json
      - scripts/publish-verified-windows.cjs

concurrency:
  group: document-compare-release-1.21.19
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Alexander-D-Loyd/Document-Compare' && github.ref == 'refs/heads/codex/publish-verified-1.21.19'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Preserve verification receipt bytes
        run: git config --global core.autocrlf false
      - name: Get publishing helper and verification receipt
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reconstruct and verify the exact locally tested package
        run: node scripts/publish-verified-windows.cjs --prepare .github/release-receipts/1.21.19.json
      - name: Publish the verified ZIP and checksum as the latest release
        run: node scripts/publish-verified-windows.cjs --publish .github/release-receipts/1.21.19.json
        env:
          GH_TOKEN: ${{ github.token }}
